name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Jest Autograding
      id: jest-autograding
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Jest Autograding
        setup-command: npm install
        command: npm test
        timeout: 10
        max-score: 100
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        JEST-AUTOGRADING_RESULTS: "${{steps.jest-autograding.outputs.result}}"
      with:
        runners: jest-autograding
